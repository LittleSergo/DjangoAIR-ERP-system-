version: '3.8'

services:
  nginx:
    restart: always
    image: nginx:1.23-alpine
    ports:
      - 80:80
    volumes:
      - ./compose/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web
  web:
    build:
      context: .
      dockerfile: compose/prod/django/Dockerfile
    image: django_air
    # '/start' is the shell script used to run the service
    command: /start
    # this volume is used to map the files and folders on the host to the container
    # so if we change code on the host, code in the docker container will also be changed
    volumes:
      - .:/app
      - static_volume:/app/static

    expose:
      - 8000
    # env_file is used to manage the env variables of the project
    env_file:
      - .env/.prod-sample
    depends_on:
      - redis
      - db

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_air
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine

  celery_worker:
    build:
      context: .
      dockerfile: compose/prod/django/Dockerfile
    image: django_air_celery_worker
    command: /start-celeryworker
    volumes:
      - .:/app
    env_file:
      - .env/.prod-sample
    depends_on:
      - redis
      - db
      - web

  celery_beat:
    build:
      context: .
      dockerfile: compose/prod/django/Dockerfile
    image: django_air_celery_beat
    command: /start-celerybeat
    volumes:
      - .:/app
    env_file:
      - .env/.prod-sample
    depends_on:
      - redis
      - db

  flower:
    build:
      context: .
      dockerfile: compose/prod/django/Dockerfile
    image: django_air_celery_flower
    command: /start-flower
    volumes:
      - .:/app
    env_file:
      - .env/.prod-sample
    ports:
      - 5557:5555
    depends_on:
      - redis
      - db

volumes:
  postgres_data: {}
  static_volume: {}
