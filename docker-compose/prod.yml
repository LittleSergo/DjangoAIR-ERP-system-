version: '3.8'

services:
  nginx:
    restart: always
    image: nginx:1.23-alpine
    ports:
      - 80:80
    volumes:
      - ../src/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/apps/static
    depends_on:
      - staff

  staff:
    build:
      context: ../
      dockerfile: src/AIR_staff/compose/prod/Dockerfile
    image: staff
    # '/start' is the shell script used to run the service
    command: /start
    # this volume is used to map the files and folders on the host to the container
    # so if we change code on the host, code in the docker container will also be changed
    volumes:
      - ../src/AIR_staff:/apps/AIR_staff
      - static_volume:/apps/AIR_staff/static
    expose:
      - 8000
    # env_file is used to manage the env variables of the project
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_air
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine

  staff_celery_worker:
    build:
      context: ../
      dockerfile: src/AIR_staff/compose/prod/Dockerfile
    image: staff_celery_worker
    command: /start-celeryworker
    volumes:
      - ../src/AIR_staff:/apps/AIR_staff
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db
      - staff

  staff_celery_beat:
    build:
      context: ../
      dockerfile: src/AIR_staff/compose/prod/Dockerfile
    image: staff_celery_beat
    command: /start-celerybeat
    volumes:
      - ../src/AIR_staff:/apps/AIR_staff
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db

  staff_flower:
    build:
      context: ../
      dockerfile: src/AIR_staff/compose/prod/Dockerfile
    image: staff_celery_flower
    command: /start-flower
    volumes:
      - ../src/AIR_staff:/apps/AIR_staff
    env_file:
      - ../.env/.prod-sample
    expose:
      - 5555
    depends_on:
      - redis
      - db

  client:
    build:
      context: ../
      dockerfile: src/AIR_client/compose/prod/Dockerfile
    image: client
    # '/start' is the shell script used to run the service
    command: /start
    # this volume is used to map the files and folders on the host to the container
    # so if we change code on the host, code in the docker container will also be changed
    volumes:
      - ../src/AIR_client:/apps/AIR_client
      - static_volume:/apps/AIR_client/static
    expose:
      - 8001
    # env_file is used to manage the env variables of the project
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db

  client_celery_worker:
    build:
      context: ../
      dockerfile: src/AIR_client/compose/prod/Dockerfile
    image: client_celery_worker
    command: /start-celeryworker
    volumes:
      - ../src/AIR_client:/apps/AIR_client
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db
      - client

  client_celery_beat:
    build:
      context: ../
      dockerfile: src/AIR_client/compose/prod/Dockerfile
    image: client_celery_beat
    command: /start-celerybeat
    volumes:
      - ../src/AIR_client:/apps/AIR_client
    env_file:
      - ../.env/.prod-sample
    depends_on:
      - redis
      - db

  client_flower:
    build:
      context: ../
      dockerfile: src/AIR_client/compose/prod/Dockerfile
    image: client_celery_flower
    command: /start-flower
    volumes:
      - ../src/AIR_client:/apps/AIR_client
    env_file:
      - ../.env/.prod-sample
    expose:
      - 5556
    depends_on:
      - redis
      - db

volumes:
  postgres_data: {}
  static_volume: {}
