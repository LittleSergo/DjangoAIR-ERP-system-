<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    {% block head %}{% endblock %}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'client/base.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>{% block title %}{% endblock %} - DjangoAIR</title>
</head>
<body>
<nav class="navbar bg-primary">
  <div class="container-fluid">
    <a href="{% url 'client:home' %}" class="navbar-brand" style="color: white;">DjangoAIR</a>
      <div class="float-sm-end">
        {% if request.user.is_authenticated %}

          <form method="post" action="{% url 'client:logout' %}" class="float-sm-end m-1">
            {% csrf_token %}
            <button class="btn btn-info" type="submit">LogOut</button>
          </form>

          <form action="{% url 'client:profile' %}" class="float-sm-end m-1">
            <button class="btn btn-info" type="submit">
            {{ request.user.username }}</button>
          </form>

        {% else %}

        <form action="{% url 'client:signup' %}" class="float-sm-end m-1">
          <button class="btn btn-info" type="submit">SignUp</button>
        </form>

        <form action="{% url 'client:login' %}" class="float-sm-end m-1">
          <button class="btn btn-info" type="submit">LogIn</button>
        </form>

        {% endif %}

      </div>
  </div>
</nav>
{% include 'client/messaging.html' %}
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="{% static 'client/base.js' %}"></script>
</body>
</html>
