{% extends 'client/base.html' %}
{% load socialaccount %}
{% load static %}
{% block title %}LogIn{% endblock %}
{% block content %}
<div class="container">
    <h1>Login</h1>
    <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-outline-success" type="submit">Login</button>
    </form>
    <a href="{% provider_login_url 'google' %}?next=/">
        <button class="btn btn-outline-success btn-google-auth">
            <img src="{% static 'client/google-icon.png' %}" width="25px">
            Login with Google
        </button>
    </a>
</div>

{% endblock %}
